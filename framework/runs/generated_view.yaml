name: SUPPLY_CHAIN_ANALYTICS_AUTO
description: Auto-generated by the ontology-mapping/template-instantiation engine from SC_DEMO.RAW against ontology supply_chain_ontology_v1.
tables:
  - name: suppliers
    base_table:
      database: SC_DEMO
      schema: RAW
      table: SUPPLIERS
    primary_key:
      columns: [supplier_id]
    dimensions:
      - name: supplier_name
        expr: supplier_name
        description: supplier_name
      - name: country
        expr: country
        description: country
      - name: region
        expr: region
        description: region
      - name: tier
        expr: tier
        description: tier
  - name: plants
    base_table:
      database: SC_DEMO
      schema: RAW
      table: PLANTS
    primary_key:
      columns: [plant_id]
    dimensions:
      - name: facility_name
        expr: plant_name
        description: facility_name
      - name: country
        expr: country
        description: country
      - name: region
        expr: region
        description: region
  - name: customers
    base_table:
      database: SC_DEMO
      schema: RAW
      table: CUSTOMERS
    primary_key:
      columns: [customer_id]
    dimensions:
      - name: customer_name
        expr: customer_name
        description: customer_name
      - name: segment
        expr: segment
        description: segment
      - name: region
        expr: region
        description: region
  - name: purchase_orders
    base_table:
      database: SC_DEMO
      schema: RAW
      table: PURCHASE_ORDERS
    primary_key:
      columns: [po_id]
    dimensions:
      - name: status
        expr: po_status
        description: status
    time_dimensions:
      - name: order_date
        expr: order_date
        description: order_date
      - name: requested_delivery_date
        expr: requested_delivery_date
        description: requested_delivery_date
    metrics:
      - name: order_cycle_time_days
        expr: "AVG(DATEDIFF('day', purchase_orders.order_date, MAX(shipments.delivery_date)))"
        description: "Average days from order placement to the last (final) delivery for that order. Demand is coarser grain than Transaction (many transactions per order via DemandLine), so this uses nested aggregation (MAX per order, then AVG across orders) -- valid as a table-scoped metric per Snowflake's 'higher granularity reference' rule for metrics, unlike fill_rate which combines two independently-owned metrics."
  - name: shipments
    base_table:
      database: SC_DEMO
      schema: RAW
      table: SHIPMENTS
    primary_key:
      columns: [shipment_id]
    time_dimensions:
      - name: ship_date
        expr: ship_date
        description: ship_date
      - name: delivery_date
        expr: delivery_date
        description: delivery_date
      - name: promised_delivery_date
        expr: promised_delivery_date
        description: promised_delivery_date
    facts:
      - name: is_on_time
        expr: "CASE WHEN shipments.delivery_date <= DATEADD('day', on_time_tolerance_days, shipments.promised_delivery_date) THEN 1.0 ELSE 0.0 END"
        data_type: NUMBER
        description: "Binary: 1 if delivered on or before the promised date (+ tolerance). Public so filters like 'late shipments' can use WHERE is_on_time = 0."
      - name: is_in_full
        expr: CASE WHEN shipments.shipped_qty >= po_lines.ordered_qty THEN 1.0 ELSE 0.0 END
        data_type: NUMBER
        access_modifier: private_access
        description: "Binary: 1 if this transaction alone covers the full ordered quantity of its demand line. References DemandLine.ordered_qty directly -- valid because this is a row-level fact and DemandLine is at lower granularity (FK lookup), per Snowflake's row-level expression rules. NOTE: ordered_qty is otherwise only used inside SUM() aggregations, so it has no standalone row-level declaration on its own table by default -- cross_refs tells the instantiation engine to auto-generate a passthrough fact for it (see Finding in implementation-findings.md: 'invalid identifier' error otherwise)."
      - name: is_defect_free
        expr: CASE WHEN shipments.defect_qty = 0 THEN 1.0 ELSE 0.0 END
        data_type: NUMBER
        access_modifier: private_access
        description: "Binary: 1 if no defects were found in this transaction."
      - name: lead_time_days
        expr: "DATEDIFF('day', purchase_orders.order_date, shipments.delivery_date)"
        data_type: NUMBER
        access_modifier: private_access
        description: "Days from order placement to this transaction's delivery. References Demand.order_date -- valid via the transitive FK path Transaction -> DemandLine -> Demand."
    metrics:
      - name: total_shipped_qty
        expr: SUM(shipments.shipped_qty)
        description: Total quantity shipped.
      - name: total_received_qty
        expr: SUM(shipments.received_qty)
        description: Total quantity received.
      - name: shipment_count
        expr: COUNT(shipments.shipment_id)
        description: Number of transactions (shipments).
      - name: on_time_delivery_rate
        expr: AVG(is_on_time) * 100
        description: Percentage of shipments delivered on or before the promised date.
      - name: otif_rate
        expr: AVG(CASE WHEN is_on_time = 1.0 AND is_in_full = 1.0 THEN 1.0 ELSE 0.0 END) * 100
        description: "Percentage of shipments that are both on-time and in-full (per-shipment grain). Debatable: could instead be defined per-order-line or per-order (see design doc Section 4)."
      - name: avg_lead_time_days
        expr: AVG(lead_time_days)
        description: Average days from order placement to delivery.
      - name: supplier_defect_rate
        expr: SUM(shipments.defect_qty) / NULLIF(SUM(shipments.received_qty), 0) * 100
        description: "Percentage of received units found defective. Debatable: unit-level (chosen) vs. shipment-level binary."
      - name: perfect_order_rate
        expr: AVG(CASE WHEN is_on_time = 1.0 AND is_in_full = 1.0 AND is_defect_free = 1.0 THEN 1.0 ELSE 0.0 END) * 100
        description: Percentage of shipments that are on-time, in-full, and defect-free.
  - name: parts
    base_table:
      database: SC_DEMO
      schema: RAW
      table: PARTS
    primary_key:
      columns: [part_id]
    dimensions:
      - name: part_name
        expr: part_name
        description: part_name
      - name: category
        expr: category
        description: category
      - name: is_critical
        expr: is_critical
        description: is_critical
  - name: po_lines
    base_table:
      database: SC_DEMO
      schema: RAW
      table: PO_LINES
    primary_key:
      columns: [po_line_id]
    facts:
      - name: ordered_qty
        expr: ordered_qty
        data_type: NUMBER
        access_modifier: private_access
        description: Passthrough fact auto-generated so Transaction.is_in_full can reference DemandLine.ordered_qty across tables.
    metrics:
      - name: total_ordered_qty
        expr: SUM(po_lines.ordered_qty)
        description: Total quantity ordered across demand lines.
      - name: total_order_value
        expr: SUM(po_lines.ordered_qty * po_lines.unit_price)
        description: Total order value (ordered_qty * unit_price).
relationships:
  - name: purchase_orders_to_customers
    left_table: purchase_orders
    right_table: customers
    relationship_columns:
      - left_column: customer_id
        right_column: customer_id
  - name: purchase_orders_to_plants
    left_table: purchase_orders
    right_table: plants
    relationship_columns:
      - left_column: plant_id
        right_column: plant_id
  - name: po_lines_to_purchase_orders
    left_table: po_lines
    right_table: purchase_orders
    relationship_columns:
      - left_column: po_id
        right_column: po_id
  - name: po_lines_to_parts
    left_table: po_lines
    right_table: parts
    relationship_columns:
      - left_column: part_id
        right_column: part_id
  - name: shipments_to_po_lines
    left_table: shipments
    right_table: po_lines
    relationship_columns:
      - left_column: po_line_id
        right_column: po_line_id
  - name: shipments_to_suppliers
    left_table: shipments
    right_table: suppliers
    relationship_columns:
      - left_column: supplier_id
        right_column: supplier_id
variables:
  - name: on_time_tolerance_days
    data_type: NUMBER
    default_value: "0"
    description: Days of grace period before a late delivery counts as late.
metrics:
  - name: fill_rate
    expr: shipments.total_shipped_qty / NULLIF(po_lines.total_ordered_qty, 0) * 100
    description: "Ratio of total shipped quantity to total ordered quantity, as a percentage. MUST be a view-level derived metric: DemandLine -> Transaction is one-to-many, so composing this as a table-scoped metric owned by Transaction fans out (see implementation-findings.md Finding 1). Debatable variant: ratio-of-quantity (chosen) vs. binary per-line-complete."